name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write
    id-token: write

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      build/release/_deps
                      ~/.cmake/packages
                  key: release-win-deps-${{ hashFiles('CMakeLists.txt') }}
                  restore-keys: release-win-deps-

            - name: Configure
              run: |
                  $VERSION = $env:GITHUB_REF_NAME.Substring(1)
                  cmake --preset release -DDTR_VERSION_STR=$VERSION

            - name: Build
              run: cmake --build build/release --config Release

            - name: Test
              run: ctest --output-on-failure -C Release
              working-directory: build/release
              env:
                  SDL_AUDIO_DRIVER: dummy
                  SDL_VIDEO_DRIVER: dummy
                  SDL_AUDIODRIVER: dummy
                  SDL_VIDEODRIVER: dummy

            - name: Package
              run: |
                  mkdir dist
                  Copy-Item build/release/Release/dithr.exe dist/
                  Copy-Item LICENSE dist/
                  Copy-Item README.md dist/
                  Compress-Archive -Path dist/* -DestinationPath dithr-windows-x64.zip

            - name: Stage npm package
              run: |
                  New-Item -ItemType Directory -Force packages/win32-x64/bin | Out-Null
                  Copy-Item build/release/Release/dithr.exe packages/win32-x64/bin/

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dithr-windows-x64
                  path: dithr-windows-x64.zip

            - name: Upload npm package
              uses: actions/upload-artifact@v7
              with:
                  name: npm-win32-x64
                  path: packages/win32-x64/

    build-linux:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7

            - name: Install dependencies
              run: |
                  sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
                  sudo apt-get update
                  sudo apt-get install -y ninja-build \
                    libx11-dev libxext-dev libxcursor-dev libxi-dev \
                    libxfixes-dev libxrandr-dev libxrender-dev libxss-dev \
                    libxtst-dev libxxf86vm-dev \
                    libwayland-dev libxkbcommon-dev \
                    libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
                    libegl1-mesa-dev libdbus-1-dev libudev-dev \
                    libasound2-dev libpulse-dev libpipewire-0.3-dev \
                    libdecor-0-dev

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      build/release/_deps
                      ~/.cmake/packages
                  key: release-linux-deps-${{ hashFiles('CMakeLists.txt') }}
                  restore-keys: release-linux-deps-

            - name: Configure
              run: cmake --preset release -DDTR_VERSION_STR=${GITHUB_REF_NAME#v}

            - name: Build
              run: cmake --build build/release --config Release

            - name: Test
              run: ctest --output-on-failure -C Release
              working-directory: build/release
              env:
                  SDL_AUDIO_DRIVER: dummy
                  SDL_VIDEO_DRIVER: dummy
                  SDL_AUDIODRIVER: dummy
                  SDL_VIDEODRIVER: dummy

            - name: Package
              run: |
                  mkdir dist
                  cp build/release/dithr dist/
                  cp LICENSE README.md dist/
                  tar czf dithr-linux-x64.tar.gz -C dist .

            - name: Stage npm package
              run: |
                  mkdir -p packages/linux-x64/bin
                  cp build/release/dithr packages/linux-x64/bin/

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dithr-linux-x64
                  path: dithr-linux-x64.tar.gz

            - name: Upload npm package
              uses: actions/upload-artifact@v7
              with:
                  name: npm-linux-x64
                  path: packages/linux-x64/

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      build/release/_deps
                      ~/.cmake/packages
                  key: release-macos-deps-${{ hashFiles('CMakeLists.txt') }}
                  restore-keys: release-macos-deps-

            - name: Configure
              run: |
                  attempts=0
                  until [ "$attempts" -ge 3 ]; do
                    attempts=$((attempts + 1))
                    echo "Configure attempt ${attempts}/3"
                    if cmake --preset release -DDTR_VERSION_STR=${GITHUB_REF_NAME#v}; then
                      exit 0
                    fi

                    echo "::warning::Configure failed (attempt ${attempts}/3). Clearing SDL3_image FetchContent state and retrying."
                    rm -rf build/release/_deps/sdl3_image-subbuild \
                           build/release/_deps/sdl3_image-src \
                           build/release/_deps/sdl3_image-build
                  done

                  echo "::error::cmake configure failed after 3 attempts"
                  exit 1

            - name: Build
              run: cmake --build build/release --config Release

            - name: Test
              run: ctest --output-on-failure -C Release
              working-directory: build/release
              env:
                  SDL_AUDIO_DRIVER: dummy
                  SDL_VIDEO_DRIVER: dummy
                  SDL_AUDIODRIVER: dummy
                  SDL_VIDEODRIVER: dummy

            - name: Package
              run: |
                  mkdir dist
                  cp build/release/dithr dist/
                  cp LICENSE README.md dist/
                  tar czf dithr-macos-arm64.tar.gz -C dist .

            - name: Stage npm package
              run: |
                  mkdir -p packages/darwin-arm64/bin
                  cp build/release/dithr packages/darwin-arm64/bin/

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dithr-macos-arm64
                  path: dithr-macos-arm64.tar.gz

            - name: Upload npm package
              uses: actions/upload-artifact@v7
              with:
                  name: npm-darwin-arm64
                  path: packages/darwin-arm64/

    build-linux-arm64:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v7

            - name: Install dependencies
              run: |
                  sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
                  sudo apt-get update
                  sudo apt-get install -y ninja-build \
                    libx11-dev libxext-dev libxcursor-dev libxi-dev \
                    libxfixes-dev libxrandr-dev libxrender-dev libxss-dev \
                    libxtst-dev libxxf86vm-dev \
                    libwayland-dev libxkbcommon-dev \
                    libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
                    libegl1-mesa-dev libdbus-1-dev libudev-dev \
                    libasound2-dev libpulse-dev libpipewire-0.3-dev \
                    libdecor-0-dev

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      build/release/_deps
                      ~/.cmake/packages
                  key: release-linux-arm64-deps-${{ hashFiles('CMakeLists.txt') }}
                  restore-keys: release-linux-arm64-deps-

            - name: Configure
              run: cmake --preset release -DDTR_VERSION_STR=${GITHUB_REF_NAME#v}

            - name: Build
              run: cmake --build build/release --config Release

            - name: Test
              run: ctest --output-on-failure -C Release
              working-directory: build/release
              env:
                  SDL_AUDIO_DRIVER: dummy
                  SDL_VIDEO_DRIVER: dummy
                  SDL_AUDIODRIVER: dummy
                  SDL_VIDEODRIVER: dummy

            - name: Package
              run: |
                  mkdir dist
                  cp build/release/dithr dist/
                  cp LICENSE README.md dist/
                  tar czf dithr-linux-arm64.tar.gz -C dist .

            - name: Stage npm package
              run: |
                  mkdir -p packages/linux-arm64/bin
                  cp build/release/dithr packages/linux-arm64/bin/

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dithr-linux-arm64
                  path: dithr-linux-arm64.tar.gz

            - name: Upload npm package
              uses: actions/upload-artifact@v7
              with:
                  name: npm-linux-arm64
                  path: packages/linux-arm64/

    build-wasm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Emscripten
              uses: emscripten-core/setup-emsdk@v16
              with:
                  version: 5.0.6
                  actions-cache-folder: emsdk-cache

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      build/wasm/_deps
                      ~/.cmake/packages
                  key: release-wasm-deps-${{ hashFiles('CMakeLists.txt') }}
                  restore-keys: release-wasm-deps-

            - name: Configure
              run: cmake --preset wasm -DDTR_WASM_CART_DIR= -DDTR_VERSION_STR=${GITHUB_REF_NAME#v}

            - name: Build
              run: cmake --build build/wasm

            - name: Verify default WASM cart path
              run: strings build/wasm/dithr.wasm | grep -Fxq '/cart/cart.json'

            - name: Stage npm package
              run: |
                  mkdir -p packages/wasm/bin
                  cp build/wasm/dithr.js packages/wasm/bin/
                  cp build/wasm/dithr.wasm packages/wasm/bin/

            - name: Upload npm package
              uses: actions/upload-artifact@v7
              with:
                  name: npm-wasm
                  path: packages/wasm/

    release:
        needs: [build-windows, build-linux, build-linux-arm64, build-macos, build-wasm]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: dithr-*
                  merge-multiple: true

            - name: Generate checksums
              run: |
                  sha256sum \
                    dithr-windows-x64.zip \
                    dithr-linux-x64.tar.gz \
                    dithr-linux-arm64.tar.gz \
                    dithr-macos-arm64.tar.gz > SHA256SUMS
                  cat SHA256SUMS

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: |
                      dithr-windows-x64.zip
                      dithr-linux-x64.tar.gz
                      dithr-linux-arm64.tar.gz
                      dithr-macos-arm64.tar.gz
                      SHA256SUMS

    verify-release-assets:
        needs: release
        runs-on: ubuntu-22.04
        steps:
            - name: Download published release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release download "${GITHUB_REF_NAME}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --pattern 'SHA256SUMS' \
                    --pattern 'dithr-*.tar.gz' \
                    --pattern 'dithr-windows-x64.zip' \
                    --dir dist

            - name: Verify published checksums
              working-directory: dist
              run: sha256sum --check SHA256SUMS

            - name: Inspect release archives
              run: |
                  unzip -t dist/dithr-windows-x64.zip
                  for archive in dist/dithr-*-*.tar.gz; do
                    tar tzf "$archive" >/dev/null
                  done

            - name: Verify published Linux executable
              run: |
                  mkdir -p dist/linux
                  tar xzf dist/dithr-linux-x64.tar.gz -C dist/linux
                  test -x dist/linux/dithr
                  dist/linux/dithr --version 2>&1 | grep -F "${GITHUB_REF_NAME#v}"

    publish-npm:
        needs: [build-windows, build-linux, build-linux-arm64, build-macos, build-wasm]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org

            - name: Remove setup-node auth token (OIDC handles auth)
              run: |
                  if [ -f ~/.npmrc ]; then
                    sed -i '/_authToken/d' ~/.npmrc
                  fi

            - name: Preflight npm versions
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  for pkg in win32-x64 linux-x64 linux-arm64 darwin-arm64 wasm sdk create; do
                    NAME="@dithrkit/$pkg"
                    if npm view "$NAME@$VERSION" version --json >/dev/null 2>&1; then
                      echo "::error::$NAME@$VERSION is already published."
                      exit 1
                    fi
                  done
                  echo "Verified $VERSION is unpublished for all @dithrkit packages."

            - name: Download platform packages
              uses: actions/download-artifact@v8
              with:
                  pattern: npm-*

            - name: Stage platform binaries
              run: |
                  mkdir -p packages/{win32-x64,linux-x64,linux-arm64,darwin-arm64,wasm}/bin
                  cp npm-win32-x64/bin/* packages/win32-x64/bin/
                  cp npm-linux-x64/bin/* packages/linux-x64/bin/
                  cp npm-linux-arm64/bin/* packages/linux-arm64/bin/
                  cp npm-darwin-arm64/bin/* packages/darwin-arm64/bin/
                  cp npm-wasm/bin/* packages/wasm/bin/
                  chmod 0755 \
                      packages/linux-x64/bin/dithr \
                      packages/linux-arm64/bin/dithr \
                      packages/darwin-arm64/bin/dithr

            - name: Verify platform package contents
              run: |
                  find packages/{win32-x64,linux-x64,linux-arm64,darwin-arm64,wasm}/bin -maxdepth 2 -type f -printf '%m %p\n'
                  test -s packages/win32-x64/bin/dithr.exe
                  test -x packages/linux-x64/bin/dithr
                  test -x packages/linux-arm64/bin/dithr
                  test -x packages/darwin-arm64/bin/dithr
                  test -s packages/wasm/bin/dithr.js
                  test -s packages/wasm/bin/dithr.wasm

            - name: Set package versions from tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  for pkg in packages/*/package.json; do
                    tmp=$(mktemp)
                    jq --arg v "$VERSION" '.version = $v' "$pkg" > "$tmp" && mv "$tmp" "$pkg"
                  done
                  # Update optionalDependencies versions in SDK
                  tmp=$(mktemp)
                  jq --arg v "$VERSION" '
                    .optionalDependencies |= with_entries(.value = $v) |
                    .version = $v
                  ' packages/sdk/package.json > "$tmp" && mv "$tmp" packages/sdk/package.json
                  # Update SDK dependency version in create package
                  tmp=$(mktemp)
                  jq --arg v "$VERSION" '
                    .dependencies["@dithrkit/sdk"] = $v |
                    .version = $v
                  ' packages/create/package.json > "$tmp" && mv "$tmp" packages/create/package.json

            - name: Determine npm publish tag
              id: npm-tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  if echo "$VERSION" | grep -qE '[-]'; then
                    echo "tag=--tag next" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish platform packages
              run: |
                  for pkg in win32-x64 linux-x64 linux-arm64 darwin-arm64 wasm; do
                    if ! npm publish "./packages/$pkg" --provenance --access public ${{ steps.npm-tag.outputs.tag }}; then
                      echo "::error::Failed publishing @dithrkit/$pkg."
                      exit 1
                    fi
                  done

            - name: Publish SDK
              run: npm publish ./packages/sdk --provenance --access public ${{ steps.npm-tag.outputs.tag }}

            - name: Publish create package
              run: npm publish ./packages/create --provenance --access public ${{ steps.npm-tag.outputs.tag }}

    verify-published:
        needs: publish-npm
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: Test published npm consumer flows
              env:
                  E2E_WORK_DIR: ${{ runner.temp }}/published-npm-e2e
              run: node tests/npm-published-e2e.js ${{ github.ref_name }}

            - name: Cache Playwright browsers
              if: runner.os == 'Linux'
              id: published-playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/wasm-browser/package-lock.json') }}

            - name: Install Playwright dependencies
              if: runner.os == 'Linux'
              working-directory: tests/wasm-browser
              run: npm ci

            - name: Install Playwright system dependencies
              if: runner.os == 'Linux'
              working-directory: tests/wasm-browser
              timeout-minutes: 8
              run: npx playwright install-deps chromium

            - name: Install Playwright browser
              if: runner.os == 'Linux' && steps.published-playwright-cache.outputs.cache-hit != 'true'
              working-directory: tests/wasm-browser
              timeout-minutes: 8
              env:
                  DEBUG: pw:install
                  PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
              run: npx playwright install --only-shell chromium

            - name: Test published JavaScript web export
              if: runner.os == 'Linux'
              working-directory: tests/wasm-browser
              env:
                  DTR_WASM_SERVE_DIR: ${{ runner.temp }}/published-npm-e2e/consumer-javascript/build/web
              run: npx playwright test

            - name: Test published TypeScript web export
              if: runner.os == 'Linux'
              working-directory: tests/wasm-browser
              env:
                  DTR_WASM_SERVE_DIR: ${{ runner.temp }}/published-npm-e2e/consumer-typescript/build/web
              run: npx playwright test
